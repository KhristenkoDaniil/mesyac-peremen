function pad(n){return String(n).padStart(2,'0')}function key(day){return '2026-11-'+pad(day)}function date(day){return new Date(2026,10,day)}function activeTasks(day){let dow=date(day).getDay();return TASKS.filter(t=>t.daily||(t.days||[]).includes(dow))}function completed(day,id){return Boolean(data[key(day)]?.[id])}function summary(day){let t=activeTasks(day);let yes=t.filter(x=>completed(day,x.id)).length;return {yes,total:t.length,pct:Math.round(100*yes/t.length)}}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Не удалось сохранить отметки. Проверь доступное место в браузере.')}}function toggle(id){let k=key(selected);data[k]??={};data[k][id]=!data[k][id];save();render()}

function calendarView(){let out=header('30 ДНЕЙ · 1–30 НОЯБРЯ','Календарь','Выбери день, чтобы посмотреть или изменить его отметки.');out+=`<section class="panel"><div class="calendar">`+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<6;i++)out+='<div></div>';for(let n=1;n<=30;n++){let s=summary(n),have=s.yes>0;out+=`<button aria-label="${n} ноября, ${s.yes} из ${s.total}" class="day ${s.yes===s.total?'all':have?'partial':''} ${n===selected?'selected':''} ${today.getFullYear()===2026&&today.getMonth()===10&&today.getDate()===n?'today':''}" onclick="choose(${n})"><span class="number">${n}</span><span class="dot"></span></button>`}out+=`</div><div class="legend"><span><i style="background:#356e4d"></i>Все выполнено</span><span><i style="background:#879c65"></i>Часть выполнена</span><span><i style="background:#5b7363"></i>Нет отметок</span></div></section>`;out+=`<section class="panel"><h2>${dateTitle(selected)}</h2><p class="sub">Выполнено ${summary(selected).yes} из ${summary(selected).total}.</p><button class="button" onclick="tab='today';render()">Открыть задачи этого дня →</button></section>`;return out}
function progressView(){let done=0,total=0,full=0,marked=0;for(let n=1;n<=30;n++){let s=summary(n);done+=s.yes;total+=s.total;if(s.yes===s.total)full++;if(s.yes)marked++}let pct=Math.round(done/total*100);let out=header('НЕ ГОНКА ЗА ИДЕАЛОМ','Мой прогресс','Статистика строится по отметкам за весь ноябрь. Неотмеченное считается невыполненным.');out+=`<div class="stat-grid"><section class="panel"><div class="stat-num">${pct}%</div><div class="stat-title">Выполнение всех задач</div></section><section class="panel"><div class="stat-num">${full}</div><div class="stat-title">Дней со всеми отметками</div></section><section class="panel"><div class="stat-num">${done}</div><div class="stat-title">Выполненных задач</div></section><section class="panel"><div class="stat-num">${marked}/30</div><div class="stat-title">Дней с отметками</div></section></div>`;out+=`<div class="section"><h2>По каждой привычке</h2></div><section class="panel">`;for(let t of TASKS){let eligible=Array.from({length:30},(_,i)=>i+1).filter(n=>activeTasks(n).some(x=>x.id===t.id)),yes=eligible.filter(n=>completed(n,t.id)).length;out+=`<div style="margin:13px 0"><div class="row between" style="font-size:12px"><span>${esc(t.title)}</span><span style="color:var(--mint)">${yes}/${eligible.length}</span></div><div class="bar" style="margin-top:6px"><div style="width:${Math.round(yes/eligible.length*100)}%"></div></div></div>`}out+='</section>';out+=`<section class="panel"><h2>Резервная копия</h2><p class="note">Данные хранятся только в этом браузере на устройстве. Сохрани резервную копию, чтобы не потерять отметки при очистке данных браузера или смене телефона.</p><div class="actions"><button class="button" onclick="exportData()">Скачать отметки</button><button class="button button-secondary" onclick="document.getElementById('importFile').click()">Восстановить из файла</button></div></section>`;out+=`<section class="panel"><h2>30 ноября</h2><p class="sub">Что стало естественным? Что улучшило жизнь? Что хочешь с function step(n){selected=Math.max(1,Math.min(30,selected+n));render()}function choose(n){selected=n;tab='today';render()}

render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
